[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurdish-rag-studio"
version = "0.1.0"
description = "Offline hybrid RAG for Kurdish, Arabic, and English documents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karden Karwan"}]

[project.scripts]
kurdish-rag = "kurdish_rag.__main__:main"
